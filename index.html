<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toronto 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <header class="panel title">
      <h1>Toronto</h1>
      <p>Downtown &amp; waterfront</p>
    </header>

    <div class="panel time">
      <span class="icon" aria-hidden="true">☀</span>
      <input id="time" type="range" min="0" max="1" step="0.001" value="0.15" aria-label="Time of day" />
      <span class="icon" aria-hidden="true">☾</span>
      <span id="time-label" class="time-label">Afternoon</span>
    </div>

    <p class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</p>
    <p class="credit">
      Map data ©
      <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
      contributors
    </p>

    <div id="loader">
      <div class="spinner"></div>
      <p>Building the city…</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
